name: Temperature Monitor
version: 1.2.2
slug: temperature_monitor
description: Receive Home Assistant temperature and humidity readings and sync them to Feishu Bitable.
url: https://github.com/neilchen-dev/temperature-monitor
arch:
  - amd64
startup: application
init: false
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: Temperature Monitor API
watchdog: http://[HOST]:[PORT:5000]/health
# Modbus RTU（USB-RS485）串口访问：uart: true 会自动映射宿主机的
# 全部 UART/串口设备，无需再逐个声明 devices。
uart: true
# Public release image. The publish workflow creates the version tag from this
# file after the Tests workflow succeeds.
image: ghcr.io/neilchen-dev/temperature-monitor
options:
  app_id: ""
  app_secret: ""
  app_token: ""
  table_id: ""
  history_api_key: ""
  temperature_api_key: ""
  history_devices: ""
  history_interval_minutes: 10
  history_timezone: Asia/Shanghai
  history_cleanup_enabled: false
  history_retention_days: 90
  history_cleanup_hour: 2
  history_table_map: ""
  device_record_map: ""
  device_id_field: 设备编号
  device_name_map: ""
  source_temperature_unit: C
  sqlite_enabled: true
  waitress_threads: 4
  modbus_enabled: false
  modbus_transport: tcp
  modbus_host: 127.0.0.1
  modbus_port: 5020
  modbus_serial_port: ""
  modbus_baudrate: 9600
  modbus_parity: N
  modbus_stopbits: 1
  modbus_bytesize: 8
  modbus_unit_id: 1
  modbus_device_id: PLC-01
  modbus_poll_interval_seconds: 5
  modbus_timeout_seconds: 5
  modbus_register_map: ""
  event_temperature_high_c: ""
schema:
  app_id: str
  app_secret: password
  app_token: password
  table_id: str
  history_api_key: password
  temperature_api_key: password
  history_devices: str
  history_interval_minutes: int(1,1440)
  history_timezone: str
  history_cleanup_enabled: bool
  history_retention_days: int(1,3650)
  history_cleanup_hour: int(0,23)
  history_table_map: str
  device_record_map: str
  device_id_field: str
  device_name_map: str
  source_temperature_unit: list(C|F)
  sqlite_enabled: bool
  waitress_threads: int(1,32)
  modbus_enabled: bool
  modbus_transport: list(tcp|rtu)
  modbus_host: str
  modbus_port: int(1,65535)
  modbus_serial_port: str
  modbus_baudrate: int(1200,115200)
  modbus_parity: list(N|E|O)
  modbus_stopbits: int(1,2)
  modbus_bytesize: int(7,8)
  modbus_unit_id: int(1,247)
  modbus_device_id: str
  modbus_poll_interval_seconds: int(1,3600)
  modbus_timeout_seconds: int(1,60)
  modbus_register_map: str
  event_temperature_high_c: str
