services:
  temperature-monitor:
    image: crpi-7apex3hoo0i4alz2.cn-hongkong.personal.cr.aliyuncs.com/noef-temperature/temperature-monitor:${IMAGE_TAG:-latest}
    container_name: temperature-monitor
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Modbus RTU（USB-RS485）时取消注释；宿主 dialout 组 gid 与容器不同
    # （Debian 惯例为 20）时，在 group_add 中填写宿主实际 gid。
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    # group_add:
    #   - "20"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
