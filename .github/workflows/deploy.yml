name: Build and Deploy

# CI -> CD 架构：
#   tests.yml 在 main 分支 push 后运行测试；
#   测试成功后由 workflow_run 触发本 workflow 完成镜像构建、推送和生产部署。
#   PR 只跑测试（tests.yml），永远不会触发本 workflow 的部署。

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  # Configure these as GitHub Actions repository variables. Values are intentionally
  # not stored in the public repository.
  REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
  IMAGE_NAME: ${{ vars.CONTAINER_IMAGE_NAME }}

jobs:
  build:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Define image tag
        id: meta
        shell: bash
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_VERSION=${{ env.IMAGE_TAG }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY,IMAGE_NAME,DEPLOY_PATH
          command_timeout: 12m

          script: |
            set -euo pipefail

            echo "Deploying image tag: ${IMAGE_TAG}"

            cd "${DEPLOY_PATH}"

            # 容器以 uid 1000 运行；确保挂载目录存在且可写。
            mkdir -p data logs
            if [ "$(stat -c %u data 2>/dev/null || echo 1000)" != "1000" ]; then
              if sudo -n chown -R 1000:1000 data logs 2>/dev/null; then
                echo "Fixed ownership of data/ and logs/"
              else
                echo "WARN: data/ 属主不是 1000 且无法自动修正；若容器写入失败请手动执行: sudo chown -R 1000:1000 data logs"
              fi
            fi

            if [ ! -f compose.yaml ]; then
              echo "ERROR: compose.yaml not found in ${DEPLOY_PATH}"
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "ERROR: .env not found in ${DEPLOY_PATH}"
              exit 1
            fi

            # 同步 compose.yaml 等仓库文件（服务器目录是 Git 仓库时）。
            # 禁止 git clean -fdx：.env、data/、logs/ 必须保留。
            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            fi

            # 安全读取 .env 中的 PORT（不 source .env，避免特殊字符破坏 shell）
            APP_PORT=$(grep -E '^PORT=' .env | tail -n 1 | cut -d= -f2 | tr -d '\r' || true)
            APP_PORT="${APP_PORT:-5000}"

            # Production sensors and status projections share a single-process
            # SQLite store. Keep enough WSGI workers available for lightweight
            # liveness and ingestion requests during I/O waits.
            CURRENT_WAITRESS_THREADS=$(grep -E '^WAITRESS_THREADS=' .env | tail -n 1 | cut -d= -f2 | tr -d '\r' || true)
            if ! [[ "${CURRENT_WAITRESS_THREADS}" =~ ^[0-9]+$ ]] || [ "${CURRENT_WAITRESS_THREADS}" -lt 16 ]; then
              if grep -q '^WAITRESS_THREADS=' .env; then
                sed -i 's/^WAITRESS_THREADS=.*/WAITRESS_THREADS=16/' .env
              else
                echo 'WAITRESS_THREADS=16' >> .env
              fi
              echo "Set WAITRESS_THREADS=16 (previous value: ${CURRENT_WAITRESS_THREADS:-unset})"
            fi

            # 记录旧镜像，用于失败回滚
            OLD_IMAGE=$(docker inspect temperature-monitor --format='{{.Config.Image}}' 2>/dev/null || true)
            OLD_TAG=$(grep -E '^IMAGE_TAG=' .env | tail -n 1 | cut -d= -f2 | tr -d '\r' || true)
            echo "Previous image: ${OLD_IMAGE:-none}"

            IMAGE_REPOSITORY="${REGISTRY}/${IMAGE_NAME}"

            echo "Deployment SQLite backup and full-database scan are disabled"

            if grep -q '^IMAGE_REPOSITORY=' .env; then
              sed -i "s|^IMAGE_REPOSITORY=.*|IMAGE_REPOSITORY=${IMAGE_REPOSITORY}|" .env
            else
              echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" >> .env
            fi

            rollback() {
              ROLLBACK_TAG="${OLD_TAG:-latest}"
              echo "ERROR: deployment failed, rolling back to IMAGE_TAG=${ROLLBACK_TAG}"
              if grep -q '^IMAGE_TAG=' .env; then
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${ROLLBACK_TAG}/" .env
              else
                echo "IMAGE_TAG=${ROLLBACK_TAG}" >> .env
              fi
              # IMAGE_TAG is exported by the SSH action and would otherwise
              # override the restored .env value during Compose interpolation.
              # Pull explicitly so a failed deployment cannot leave the new
              # image running while merely reporting a rollback.
              env -u IMAGE_TAG docker compose pull || true
              if env -u IMAGE_TAG docker compose up -d --remove-orphans --wait --wait-timeout 600; then
                echo "Rolled back to ${ROLLBACK_TAG}"
              else
                echo "ERROR: rollback to ${ROLLBACK_TAG} could not be verified"
              fi
              exit 1
            }

            # 只修改 IMAGE_TAG 行，保留 .env 其余所有业务配置
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            docker compose pull || rollback

            # 不使用 down -v；data/ 与 logs/ 挂载卷中的 SQLite 数据和日志保持不动
            docker compose up -d --remove-orphans --wait --wait-timeout 600 || rollback

            docker compose ps

            if ! HEALTH_STATUS=$(curl --connect-timeout 3 --max-time 5 \
              --fail --silent --show-error --retry 10 --retry-delay 3 \
              "http://127.0.0.1:${APP_PORT}/health"); then
              rollback
            fi

            # /health is the constant-time liveness probe and includes the
            # runtime availability snapshot. /api/system/status performs
            # diagnostic aggregates and can contend with startup SQLite work.
            if ! RUNTIME_AVAILABLE=$(printf '%s' "${HEALTH_STATUS}" | docker exec -i temperature-monitor python -c \
              'import json, sys; runtime=json.load(sys.stdin).get("runtime", {}); print("true" if runtime.get("available") is True and runtime.get("scheduler_running") is True else "false")'); then
              echo "ERROR: unable to parse runtime liveness from health response"
              rollback
            fi
            if [ "${RUNTIME_AVAILABLE}" != "true" ]; then
              echo "ERROR: Shadow Runtime is not available after deployment; migration/startup likely failed"
              rollback
            fi

            # Keep alarm-chain readiness visible, but do not roll back a live
            # release solely because historical task state is still blocked.
            # Rolling back to the old image would restore the unbounded DB scans
            # that can starve both health probes and sensor ingestion.
            AUTOMATION_MODE_VALUE=$(grep -E '^AUTOMATION_MODE=' .env | tail -n 1 | cut -d= -f2- | tr -d '\r' || true)
            case "${AUTOMATION_MODE_VALUE}" in
              active|shadow)
                READY_STATUS=""
                for attempt in $(seq 1 30); do
                  READY_STATUS=$(curl --connect-timeout 3 --max-time 5 \
                    --silent --show-error \
                    --output /tmp/temperature-monitor-readyz.json \
                    --write-out '%{http_code}' \
                    "http://127.0.0.1:${APP_PORT}/readyz" || true)
                  if [ "${READY_STATUS}" = "200" ]; then
                    break
                  fi
                  sleep 3
                done
                if [ "${READY_STATUS}" != "200" ]; then
                  echo "::warning::Runtime is live but strict readiness is still blocked (HTTP ${READY_STATUS:-no response}); keeping the new image deployed"
                  if [ -f /tmp/temperature-monitor-readyz.json ]; then
                    cat /tmp/temperature-monitor-readyz.json
                  fi
                else
                  echo "Runtime readiness passed"
                fi
                ;;
              *)
                echo "Runtime readiness gate skipped for AUTOMATION_MODE=${AUTOMATION_MODE_VALUE:-disabled}"
                ;;
            esac

            echo
            echo "Deployment successful: ${IMAGE_TAG}"
